version: '3.8'

services:
  iex-api:
    build: .
    container_name: group05-iex-api
    ports:
      - "5000:5000"
    volumes:
      # Mount data + models so they persist outside container
      - ./data:/app/data
      - ./models:/app/models
      - ./app/static:/app/app/static
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

